name: "test-frontend"
on:
    pull_request:
        paths:
            - "src/**"
            - "package.json"
            - "tsconfig.json"

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: setup node
              uses: actions/setup-node@v3
              with:
                  node-version: 22
            - run: npm ci
            - run: npm test

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: setup node
              uses: actions/setup-node@v3
              with:
                  node-version: 22
            - run: npm ci
            - run: npm run lint

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: setup node
              uses: actions/setup-node@v3
              with:
                  node-version: 22
            - run: npm ci
            - run: npx tsc --noEmit

    build:
        needs: [test, lint, typecheck]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: setup node
              uses: actions/setup-node@v3
              with:
                  node-version: 22
            - run: npm ci
            - run: npm run build
