name: "release"

on:
    workflow_dispatch:
        inputs:
            bump:
                description: "Version bump type"
                required: true
                type: choice
                options:
                    - patch
                    - minor
                    - major

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.bump.outputs.version }}
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
              with:
                  token: ${{ secrets.PAT }}

            - name: setup node
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: configure git
              run: |
                  git config user.name "${{ github.actor }}"
                  git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

            - name: bump version
              id: bump
              env:
                  BUMP: ${{ inputs.bump }}
              run: |
                  npm version "$BUMP" -w @sphere/app --no-git-tag-version
                  VERSION=$(node -p "require('./apps/sphere/package.json').version")
                  git add apps/sphere/package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
                  git commit -m "$VERSION"
                  git tag "v$VERSION"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: push version commit and tag
              run: |
                  git push
                  git push --tags

    publish-tauri:
        needs: version
        strategy:
            fail-fast: false
            matrix:
                platform: [macos-latest, windows-latest]
                # platform: [macos-latest, ubuntu-latest, windows-latest]

        runs-on: ${{ matrix.platform }}
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v6
              with:
                  ref: v${{ needs.version.outputs.version }}

            - name: setup node
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: install Rust stable
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  toolchain: 1.92

            # - name: install dependencies (ubuntu only)
            #   if: matrix.platform == 'ubuntu-latest'
            #   run: |
            #     sudo apt-get update
            #     sudo apt-get install -y libgtk-3-dev webkit2gtk-4.0 libappindicator3-dev librsvg2-dev patchelf

            - name: install frontend dependencies
              run: npm ci

            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
                  releaseName: "v__VERSION__"
                  releaseBody: "See the assets to download this version and install."
                  releaseDraft: true
                  prerelease: false
                  includeDebug: false
