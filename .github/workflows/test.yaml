name: "test"
on:
    pull_request:
        paths:
            - "src-tauri/**"
            - "crates/**"

jobs:
    test-crates:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: install Rust stable
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  toolchain: 1.92
            - name: test libexpression
              run: cargo test --manifest-path crates/libexpression/Cargo.toml
            - name: test libsphere
              run: cargo test --manifest-path crates/libsphere/Cargo.toml
            - name: test mbtiles
              run: cargo test --manifest-path crates/mbtiles/Cargo.toml
            - name: test tilejson
              run: cargo test --manifest-path crates/tilejson/Cargo.toml

    test-tauri:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v3
            - name: install Rust stable
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  toolchain: 1.92
            - name: install dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
            - name: test tauri
              working-directory: src-tauri
              run: cargo test
